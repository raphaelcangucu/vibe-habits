name: iOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_store_version:
        description: App Store version whose listing should be synchronized
        required: true
        default: "1.1.0"
        type: string
      listing_only:
        description: Skip tests, signing, archive, and binary upload
        required: true
        default: true
        type: boolean
      submit_for_review:
        description: Submit the editable App Store version for review after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and upload build, metadata, and screenshots
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_IDENTIFIER: app.vibehabits.ios
      APP_EXTENSION_IDENTIFIER: app.vibehabits.ios.widget
      APPLE_TEAM_ID: SB6QYUH97U
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: main
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Select the latest installed Xcode 26
        run: |
          xcode_path="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)"
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure read-only Match access
        if: github.event_name == 'push' || inputs.listing_only == false
        env:
          MATCH_GIT_PRIVATE_KEY_BASE64: ${{ secrets.MATCH_GIT_PRIVATE_KEY_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s' "$MATCH_GIT_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/match-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/match-ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/match-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/match-ssh/known_hosts"
          echo "MATCH_GIT_PRIVATE_KEY=$RUNNER_TEMP/match-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/match-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/match-ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Show build tool versions
        run: |
          xcodebuild -version
          bundle exec fastlane --version

      - name: Test, archive, and upload
        if: github.event_name == 'push' || inputs.listing_only == false
        run: bundle exec fastlane ios release

      - name: Upload App Store metadata and screenshots
        env:
          REQUESTED_APP_STORE_VERSION: ${{ inputs.app_store_version }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            app_store_version="$REQUESTED_APP_STORE_VERSION"
          else
            app_store_version="${GITHUB_REF_NAME#v}"
          fi
          APP_STORE_VERSION="$app_store_version" bundle exec fastlane ios store_listing

      - name: Upload build logs when the release fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ~/Library/Logs/gym
            fastlane/test_output
          if-no-files-found: ignore
          retention-days: 14
